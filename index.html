<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Константа — WordPress-демо</title>
  <meta name="description" content="Демонстрационный стенд WordPress-сайта «Константа»: скупка кабеля, провода, арматуры, электрики и металлопроката.">
  <meta name="theme-color" content="#0B0E11">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0E11;
      --panel: #12171C;
      --line: rgba(255, 255, 255, .08);
      --text: #E9EDF1;
      --muted: #93A0AC;
      --accent: #E07B39;
      --accent-2: #F2A65A;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100dvh;
      overflow: hidden;
      color: var(--text);
      background: var(--bg);
      font-family: Manrope, "Segoe UI", system-ui, sans-serif;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 54px;
      padding: 8px 18px;
      background: linear-gradient(180deg, #141A20, #0E1216);
      border-bottom: 1px solid var(--line);
      z-index: 3;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      font-family: Unbounded, Manrope, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .05em;
      white-space: nowrap;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-2), #C85A1E);
      color: #14100C;
      font-family: Unbounded, sans-serif;
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
    }

    .tag {
      padding-left: 14px;
      border-left: 1px solid var(--line);
      color: var(--muted);
      font-size: 12.5px;
      white-space: nowrap;
    }

    .hint {
      color: var(--muted);
      font-size: 12.5px;
      white-space: nowrap;
    }

    .hint b {
      color: var(--text);
      font-weight: 600;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      background: rgba(255, 255, 255, .03);
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color .2s, background .2s, color .2s;
    }

    .btn:hover {
      border-color: rgba(224, 123, 57, .55);
      background: rgba(224, 123, 57, .1);
    }

    .btn--accent {
      border-color: transparent;
      background: linear-gradient(135deg, var(--accent-2), #D96B2B);
      color: #17110C;
    }

    .btn--accent:hover {
      background: linear-gradient(135deg, #FFB46F, #E07B39);
      color: #17110C;
    }

    .frame {
      position: relative;
      min-height: 0;
      background: var(--bg);
    }

    .frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .loader {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(600px 300px at 50% 30%, rgba(224, 123, 57, .12), transparent 70%),
        var(--bg);
      z-index: 2;
      transition: opacity .35s ease, visibility .35s ease;
    }

    .loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, .12);
      border-top-color: var(--accent-2);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }

    .loader strong {
      font-family: Unbounded, Manrope, sans-serif;
      font-size: 15px;
      font-weight: 500;
    }

    .loader span {
      max-width: 420px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 860px) {
      .tag, .hint { display: none; }
    }

    @media (max-width: 560px) {
      .bar {
        flex-wrap: wrap;
        gap: 8px 12px;
        padding: 10px 14px;
      }

      .links {
        width: 100%;
        margin-left: 0;
      }

      .links .btn {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="./" aria-label="Константа — WordPress-демо">
      <span class="mark" aria-hidden="true">К</span>
      <span>Константа</span>
    </a>
    <span class="tag">WordPress-демо</span>
    <span class="hint">Вход в админку: <b>admin</b> / <b>admin</b></span>
    <nav class="links" aria-label="Действия">
      <a class="btn" href="prototype.html">Статический прототип</a>
      <a class="btn btn--accent" id="open-external" href="https://playground.wordpress.net/?blueprint-url=https%3A%2F%2Fzhibinov.github.io%2Fskupka-demo%2Fwp%2Fblueprint.json" target="_blank" rel="noopener">Открыть отдельно ↗</a>
    </nav>
  </header>

  <main class="frame">
    <div class="loader" id="loader">
      <div class="spinner" aria-hidden="true"></div>
      <strong>Запускаем WordPress</strong>
      <span>Первый запуск может занять до 1–2 минут: браузер загружает WordPress и демо-контент. Дальше сайт работает быстрее.</span>
    </div>

    <iframe
      id="wp"
      title="WordPress-сайт «Константа»"
      src="https://playground.wordpress.net/?blueprint-url=https%3A%2F%2Fzhibinov.github.io%2Fskupka-demo%2Fwp%2Fblueprint.json"
      allow="clipboard-read; clipboard-write; fullscreen"
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </main>

  <script>
    (function () {
      var frame = document.getElementById('wp');
      var loader = document.getElementById('loader');
      var external = document.getElementById('open-external');
      var blueprint = 'https://zhibinov.github.io/skupka-demo/wp/blueprint.json';
      var playground = 'https://playground.wordpress.net/?blueprint-url=' + encodeURIComponent(blueprint);

      external.href = playground;

      function hideLoader() {
        loader.classList.add('is-hidden');
      }

      frame.addEventListener('load', function () {
        window.setTimeout(hideLoader, 800);
      });

      window.setTimeout(hideLoader, 12000);
    })();
  </script>
</body>
</html>
